[package]
name = "uu_rg"
description = "rg ~ (recurbusybox) recursively search for a regexp, ripgrep-style"
repository = "https://github.com/icehomura/RecurBusyBox/tree/main/src/uu/rg"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/rg.rs"
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true }
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"

[lints]
workspace = true

[[bin]]
name = "rg"
path = "src/main.rs"
