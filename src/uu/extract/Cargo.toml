[package]
name = "uu_extract"
description = "extract ~ (recurbusybox) universal archive extractor"
repository = "https://github.com/icehomura/RecurBusyBox/tree/main/src/uu/extract"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/extract.rs"
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate", "lzma", "deflate64", "time"] }
sevenz-rust = "0.6"
rar = "0.4"
ruzstd = "0.9"
lzma-rs = { version = "0.3", features = ["stream"] }
bzip2-rs = "0.1"
walkdir = "2"

[lints]
workspace = true

[[bin]]
name = "extract"
path = "src/main.rs"
