name: Release

# Builds the `recurbusybox` multi-call binary for every platform RecurCode
# ships on and publishes them as release assets. Asset names match RecurCode's
# own platform keys (`windows-x86_64`, `darwin-aarch64`, `linux-x86_64`, ...)
# so its component registry can wire URLs without a second mapping, and each
# archive ships a `.sha256` sidecar the downloader verifies.
#
# Pushing a `v*` tag cuts a release; `workflow_dispatch` builds without one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The portable core set plus RecurBusyBox's own tools.
  FEATURES: feat_common_core,feat_recur_tools

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - platform: darwin-x86_64
            target: x86_64-apple-darwin
            os: macos-latest
          - platform: darwin-aarch64
            target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the aarch64-linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --no-default-features --features ${{ env.FEATURES }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="recurbusybox-${{ matrix.platform }}"
          mkdir -p "dist/$out"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/recurbusybox.exe" "dist/$out/recurbusybox.exe"
            (cd "dist/$out" && 7z a "../$out.zip" recurbusybox.exe >/dev/null)
            archive="dist/$out.zip"
          else
            cp "target/${{ matrix.target }}/release/recurbusybox" "dist/$out/recurbusybox"
            tar -C "dist/$out" -czf "dist/$out.tar.gz" recurbusybox
            archive="dist/$out.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" | awk '{print $1}' > "$archive.sha256"
          else
            shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: recurbusybox-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
